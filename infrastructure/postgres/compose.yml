# Infrastructure component: PostgreSQL.
#
# This is deployed and restarted ONLY by the infrastructure path
# (scripts/deploy/bootstrap-ec2.sh or a deliberate infra update), never by an
# application release. postgres_data must survive every application deploy,
# every restart, and every rollback. Bound to loopback only — never exposed
# through the Security Group.
services:
  postgres:
    image: postgres:17-alpine
    container_name: portfolioiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: portfolioiq_postgres_data
