# Infrastructure component: Caddy (TLS-terminating reverse proxy).
#
# This is deployed and restarted ONLY by the infrastructure deploy path
# (scripts/deploy/bootstrap-ec2.sh or a deliberate infra update), never by an
# application release. caddy_data holds ACME account/certificate state and
# must survive every application deploy and every restart.
services:
  caddy:
    image: caddy:2-alpine
    container_name: portfolioiq-caddy
    restart: unless-stopped
    # Host networking, not bridge+extra_hosts: the app services bind to
    # 127.0.0.1 only (deliberately, so nothing but same-host processes can
    # reach them). From a bridge network, host.docker.internal resolves to
    # the bridge gateway IP, which is a different interface than loopback —
    # a service bound to 127.0.0.1 is unreachable through it, full stop.
    # Host networking puts Caddy in the same network namespace as the app
    # services, so "127.0.0.1" inside the container is the same loopback.
    # (Confirmed by a real failure: loopback health checks in
    # remote-deploy.sh passed, but Caddy still 502'd until this was fixed.)
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
    name: portfolioiq_caddy_data
  caddy_config:
    name: portfolioiq_caddy_config
