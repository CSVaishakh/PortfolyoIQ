name: CI

on:
  push:
  pull_request:

# CI only ever reads the repository — it builds and tests, it never pushes,
# comments, or deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_rebalancing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (react-client)
        run: bun run --filter react-client lint

      - name: Typecheck + build all workspaces
        run: bun run --filter '*' build

      - name: Test react-client
        run: bun run --filter react-client test

      - name: Test platform-service
        # TEST_DATABASE_URL lets the migration test exercise a real Postgres
        # instead of reporting itself skipped; every other test in this suite
        # substitutes the query layer and never opens a real connection (see
        # tests/setup-env.ts).
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_rebalancing
        run: bun run --filter platform-service test

  model-service:
    name: model-service (Python 3.11 via uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: apps/model-service
        run: |
          uv venv --python 3.11 .venv
          uv pip install -r requirements.txt --python .venv/bin/python

      - name: Run tests
        working-directory: apps/model-service
        run: |
          source .venv/bin/activate
          python -m unittest discover -s tests -t .
